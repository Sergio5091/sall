<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trouver une salle - GameOn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
    <style>
        :root {
            --background-dark: #121118;
            --gray-600: #4B5563;
            --gray-500: #6B7280;
            --gray-400: #9CA3AF;
            --gray-700: #374151;
        }
        body {
            background-color: var(--background-dark);
        }
        .bg-background-dark {
            background-color: var(--background-dark);
        }
        .bg-gray-600 { background-color: var(--gray-600); }
        .bg-gray-500 { background-color: var(--gray-500); }
        .bg-gray-400 { background-color: var(--gray-400); }
        .bg-gray-700 { background-color: var(--gray-700); }
        .text-gray-400 { color: var(--gray-400); }
        .text-gray-500 { color: var(--gray-500); }
        .text-gray-600 { color: var(--gray-600); }
        .text-gray-700 { color: var(--gray-700); }
        .border-gray-600 { border-color: var(--gray-600); }
        .border-gray-500 { border-color: var(--gray-500); }
        .hover\:bg-gray-500:hover { background-color: var(--gray-500); }
        .hover\:bg-gray-600:hover { background-color: var(--gray-600); }
        .hover\:bg-gray-700:hover { background-color: var(--gray-700); }
        .hover\:border-gray-500:hover { border-color: var(--gray-500); }
        .focus\:border-gray-500:focus { border-color: var(--gray-500); }
        .focus\:ring-gray-500:focus { --tw-ring-color: var(--gray-500); }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .group:hover .group-hover\:text-gray-400 {
            color: var(--gray-400);
        }
        .group:hover .group-hover\:scale-105 {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="min-h-screen text-[#222222] font-body">
    <!-- TopNavBar -->
    <header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-center backdrop-blur-sm shadow-sm">
        <div class="flex items-center justify-between w-full max-w-7xl px-6 py-3">
            <div class="flex items-center gap-8">
                <a href="/" class="flex items-center gap-2 text-white">
                    <i class="fas fa-arrow-left text-xl"></i>
                    <span class="text-lg">Retour</span>
                </a>
                <div class="flex items-center gap-2 text-white">
                    <i class="fas fa-gamepad text-3xl text-gray-400"></i>
                    <h2 class="text-white text-2xl font-display font-bold">GameOn</h2>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="/login" class="flex min-w-[84px] items-center justify-center overflow-hidden rounded-full h-11 px-5 bg-gray-600 text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-gray-500 transition-colors">
                    <span class="truncate">Connexion</span>
                </a>
                <a href="/register" class="flex min-w-[84px] items-center justify-center overflow-hidden rounded-full h-11 px-5 bg-gray-700 text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-gray-600 transition-all">
                    <span class="truncate">S'inscrire</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Search Section -->
    <section class="relative min-h-screen bg-background-dark pt-20">
        <!-- Animation 3D Background -->
        <div id="background3d" class="absolute inset-0 overflow-hidden">
            <canvas id="canvas3d" class="absolute inset-0 w-full h-full"></canvas>
        </div>
        <!-- Overlay gradient pour la lisibilité -->
        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-black/20 to-black/60 z-5"></div>
        
        <div class="relative z-10 max-w-4xl mx-auto px-4 py-12">
            <!-- Search Header -->
            <div class="text-center mb-8">
                <h1 class="text-white text-3xl sm:text-4xl md:text-5xl font-display font-bold leading-tight tracking-tighter mb-4">
                    Trouver une salle près de chez vous
                </h1>
                <p class="text-white/80 text-lg font-normal leading-normal">
                    Entrez votre localisation pour découvrir les centres de loisirs disponibles
                </p>
            </div>

            <!-- Search Form -->
            <div class="bg-[#1c1c27]/90 backdrop-blur-sm rounded-2xl p-6 shadow-2xl border border-gray-600/20">
                <div class="space-y-6">
                    <!-- Location Input -->
                    <div>
                        <label class="block text-white text-sm font-medium mb-2">
                            <i class="fas fa-map-marker-alt mr-2 text-gray-400"></i>
                            Votre localisation
                        </label>
                        <div class="flex gap-3">
                            <div class="flex-1">
                                <input 
                                    id="searchQuery"
                                    type="text" 
                                    class="w-full px-4 py-3 bg-[#2a2a3a] border border-gray-600/30 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-500/20 transition-all"
                                    placeholder="Ville, code postal ou adresse..."
                                    onkeyup="if(event.key === 'Enter') searchRooms()"
                                />
                            </div>
                            <button 
                                onclick="getCurrentLocation()"
                                class="px-4 py-3 bg-gray-600 text-white rounded-xl hover:bg-gray-500 transition-all duration-300 transform hover:scale-105"
                                title="Utiliser ma position actuelle"
                            >
                                <i class="fas fa-location-crosshairs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Filters -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-white text-sm font-medium mb-2">
                                <i class="fas fa-gamepad mr-2 text-gray-400"></i>
                                Type de jeux
                            </label>
                            <select id="gameType" class="w-full px-4 py-3 bg-[#2a2a3a] border border-gray-600/30 rounded-xl text-white focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-500/20 transition-all">
                                <option value="">Tous les types</option>
                                <option value="fps">FPS / Tir</option>
                                <option value="racing">Course / Racing</option>
                                <option value="sports">Sports</option>
                                <option value="rpg">RPG / Aventure</option>
                                <option value="vr">Réalité Virtuelle</option>
                                <option value="retro">Rétrogaming</option>
                                <option value="mobile">Mobile / Tablettes</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-white text-sm font-medium mb-2">
                                <i class="fas fa-users mr-2 text-gray-400"></i>
                                Nombre de joueurs
                            </label>
                            <select id="playerCount" class="w-full px-4 py-3 bg-[#2a2a3a] border border-gray-600/30 rounded-xl text-white focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-500/20 transition-all">
                                <option value="">Indifférent</option>
                                <option value="1">1 joueur</option>
                                <option value="2">2 joueurs</option>
                                <option value="4">4 joueurs</option>
                                <option value="6">6 joueurs</option>
                                <option value="8">8+ joueurs</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-white text-sm font-medium mb-2">
                                <i class="fas fa-euro-sign mr-2 text-gray-400"></i>
                                Prix maximum
                            </label>
                            <select id="maxPrice" class="w-full px-4 py-3 bg-[#2a2a3a] border border-gray-600/30 rounded-xl text-white focus:outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-500/20 transition-all">
                                <option value="">Indifférent</option>
                                <option value="10">Moins de 10€</option>
                                <option value="20">Moins de 20€</option>
                                <option value="30">Moins de 30€</option>
                                <option value="50">Moins de 50€</option>
                            </select>
                        </div>
                    </div>

                    <!-- Search Button -->
                    <button 
                        onclick="searchRooms()"
                        class="w-full py-4 bg-gradient-to-r from-gray-600 to-gray-500 text-white text-lg font-bold rounded-xl hover:from-gray-500 hover:to-gray-400 transition-all duration-300 transform hover:scale-105 shadow-lg"
                    >
                        <i class="fas fa-search mr-3"></i>
                        Rechercher des salles
                    </button>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="mt-8 text-center hidden">
                <div class="inline-flex items-center gap-3 text-white">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-gray-400"></div>
                    <span>Recherche en cours...</span>
                </div>
            </div>

            <!-- Results -->
            <div id="results" class="mt-8 space-y-4 hidden">
                <h2 class="text-white text-2xl font-bold mb-4">
                    <span id="resultCount">0</span> salles trouvées
                </h2>
                
                <div id="roomsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Results will be inserted here -->
                </div>
            </div>

            <!-- No Results -->
            <div id="noResults" class="mt-8 text-center py-12 hidden">
                <i class="fas fa-search text-6xl text-gray-500 mb-4"></i>
                <h3 class="text-white text-xl font-bold mb-2">Aucune salle trouvée</h3>
                <p class="text-gray-400">
                    Essayez d'élargir votre recherche ou de modifier les filtres
                </p>
            </div>
        </div>
    </section>

    <script>
        // Mock data
        const mockRooms = [
            {
                id: 1,
                name: 'Cyber Arena Pro',
                rating: 4.8,
                reviews: 156,
                distance: '1.2 km',
                price: '15€',
                image: 'https://picsum.photos/seed/cyber1/200/200.jpg'
            },
            {
                id: 2,
                name: 'VR Experience Center',
                rating: 4.9,
                reviews: 89,
                distance: '2.5 km',
                price: '25€',
                image: 'https://picsum.photos/seed/vr2/200/200.jpg'
            },
            {
                id: 3,
                name: 'Retro Game Paradise',
                rating: 4.7,
                reviews: 234,
                distance: '3.8 km',
                price: '12€',
                image: 'https://picsum.photos/seed/retro3/200/200.jpg'
            },
            {
                id: 4,
                name: 'Esports Training Zone',
                rating: 4.6,
                reviews: 178,
                distance: '4.1 km',
                price: '18€',
                image: 'https://picsum.photos/seed/esports4/200/200.jpg'
            }
        ];

        let searchResults = [];

        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('searchQuery').value = 'Position actuelle';
                    },
                    (error) => {
                        console.error('Error getting location:', error);
                        alert('Impossible d\'obtenir votre position. Veuillez entrer votre localisation manuellement.');
                    }
                );
            } else {
                alert('La géolocalisation n\'est pas supportée par votre navigateur.');
            }
        }

        function searchRooms() {
            const searchQuery = document.getElementById('searchQuery').value;
            if (!searchQuery.trim()) {
                alert('Veuillez entrer une localisation');
                return;
            }

            // Show loading
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');
            document.getElementById('noResults').classList.add('hidden');

            // Simulate API call
            setTimeout(() => {
                // Filter mock results based on search criteria
                let filteredRooms = mockRooms;
                const maxPrice = document.getElementById('maxPrice').value;
                
                if (maxPrice) {
                    filteredRooms = filteredRooms.filter(room => 
                        parseInt(room.price.replace('€', '')) <= parseInt(maxPrice)
                    );
                }

                searchResults = filteredRooms;
                displayResults();
                
                // Hide loading
                document.getElementById('loadingState').classList.add('hidden');
            }, 1500);
        }

        function displayResults() {
            const resultsDiv = document.getElementById('results');
            const roomsGrid = document.getElementById('roomsGrid');
            const resultCount = document.getElementById('resultCount');
            const noResults = document.getElementById('noResults');

            if (searchResults.length === 0) {
                resultsDiv.classList.add('hidden');
                noResults.classList.remove('hidden');
                return;
            }

            resultCount.textContent = searchResults.length;
            roomsGrid.innerHTML = '';

            searchResults.forEach(room => {
                const roomCard = `
                    <div class="bg-[#1c1c27]/90 backdrop-blur-sm rounded-xl p-6 border border-gray-600/20 hover:border-gray-500/40 transition-all duration-300 transform hover:scale-105 group">
                        <div class="flex gap-4">
                            <img 
                                src="${room.image}" 
                                alt="${room.name}"
                                class="w-24 h-24 rounded-lg object-cover"
                            />
                            <div class="flex-1">
                                <h3 class="text-white text-lg font-bold mb-1 group-hover:text-gray-400 transition-colors">
                                    ${room.name}
                                </h3>
                                <div class="flex items-center gap-2 text-sm text-gray-300 mb-2">
                                    <i class="fas fa-star text-yellow-500"></i>
                                    <span>${room.rating}</span>
                                    <span>(${room.reviews} avis)</span>
                                </div>
                                <div class="flex items-center gap-4 text-sm text-gray-300">
                                    <span class="flex items-center gap-1">
                                        <i class="fas fa-map-marker-alt text-gray-400"></i>
                                        ${room.distance}
                                    </span>
                                    <span class="flex items-center gap-1">
                                        <i class="fas fa-euro-sign text-gray-400"></i>
                                        ${room.price}/h
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4 flex gap-3">
                            <button class="flex-1 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-500 transition-colors">
                                Réserver
                            </button>
                            <button class="flex-1 py-2 border border-gray-500 text-gray-400 rounded-lg hover:bg-gray-500/10 transition-colors">
                                Détails
                            </button>
                        </div>
                    </div>
                `;
                roomsGrid.innerHTML += roomCard;
            });

            resultsDiv.classList.remove('hidden');
            noResults.classList.add('hidden');
        }

        // Initialize 3D background (simplified version)
        function init3DBackground() {
            const canvas = document.getElementById('canvas3d');
            if (!canvas) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x121118, 0.8);

            // Add some simple particles
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 100;
            const positions = new Float32Array(particlesCount * 3);
            
            for (let i = 0; i < particlesCount * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 100;
            }
            
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const particlesMaterial = new THREE.PointsMaterial({
                color: 0x808080,
                size: 0.5,
                transparent: true,
                opacity: 0.8
            });
            
            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);

            camera.position.z = 50;

            function animate() {
                requestAnimationFrame(animate);
                particlesMesh.rotation.y += 0.001;
                renderer.render(scene, camera);
            }

            animate();

            // Handle resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            init3DBackground();
        });
    </script>
</body>
</html>
