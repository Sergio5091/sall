runtime: php82
env: flex

runtime_config:
  document_root: public

# Ensure we skip ".env", which is only for local development
skip_files:
  - .env

env_variables:
  # Put production environment variables here.
  APP_ENV: production
  APP_DEBUG: false
  APP_LOG: errorlog
  APP_KEY: # Your APP_KEY from php artisan key:generate --show

# Configure the database
  DB_CONNECTION: mysql
  DB_HOST: # Cloud SQL instance connection name
  DB_DATABASE: sall
  DB_USERNAME: root
  DB_PASSWORD: # Your database password

# Configure the nginx server
nginx_config_include: /app/nginx_app.conf

automatic_scaling:
  min_num_instances: 1
  max_num_instances: 2
  cpu_utilization:
    target_utilization: 0.75
