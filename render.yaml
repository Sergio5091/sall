services:
  # Web Service
  - type: web
    name: sall
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: sall-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sall-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: sall-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sall-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sall-db
          property: password

  # MySQL Database
  - type: pserv
    name: sall-db
    env: mysql
    plan: free
    databaseName: sall
    user: sall_user
